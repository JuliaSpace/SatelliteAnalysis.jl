name: CI-nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  # Required by `julia-actions/cache` to delete old caches.
  actions: write
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Julia nightly can break for reasons unrelated to this package.
    continue-on-error: true
    env:
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
          - arm64
        exclude:
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
